name: Verify skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint dependency
        run: python -m pip install ruff==0.15.21
      - name: Validate public skill contents
        run: python scripts/verify_skills.py --repository .
      - name: Lint Python
        run: >-
          ruff check --select E4,E7,E9,F,I
          scripts
          tests
          skills/agent-work-auditor/scripts
          skills/product-design/scripts
          skills/product-design-contract/scripts
          skills/product-design-change/scripts
          skills/product-design-implementation/scripts
          skills/product-design-review/scripts
          deprecated/design-steward/scripts
          benchmarks/design-steward/2026-08-06/scripts
          benchmarks/design-steward/2026-08-06-iteration-2/scripts
          benchmarks/design-steward-specialists/2026-08-06-iteration-2/scripts
      - name: Run repository verifier tests
        run: python -m unittest tests/test_verify_skills.py -v
      - name: Verify Product Design suite contract
        run: python -m unittest tests/test_product_design_suite.py -v
      - name: Verify Product Design router validators
        run: |
          python skills/product-design/scripts/test_validate_route.py
          python skills/product-design/scripts/test_validate_toolchain.py
      - name: Verify Product Design contracts and evidence guards
        run: |
          python skills/product-design-contract/scripts/test_validate_design_contract.py
          python skills/product-design-change/scripts/test_change_guard.py
          python skills/product-design-change/scripts/test_preservation_guard.py
          python skills/product-design-implementation/scripts/test_check_protected_paths.py
          python skills/product-design-review/scripts/test_classify_visual_evidence.py
      - name: Verify deprecated Design Steward specialist integration
        run: python -m unittest tests/test_design_steward_specialists.py -v
      - name: Verify deprecated Design Steward archive contract
        run: python -m unittest tests/test_design_steward_release_contract.py -v
      - name: Run auditor renderer tests
        run: python skills/agent-work-auditor/scripts/test_generate_report.py
      - name: Run deprecated Design Brief validator tests
        run: python deprecated/design-steward/scripts/test_validate_design_brief.py
      - name: Reproduce frozen benchmark aggregates
        run: |
          python benchmarks/design-steward/2026-08-06/scripts/build_blind_pairs.py
          python benchmarks/design-steward/2026-08-06/scripts/aggregate_grades.py
          python benchmarks/design-steward/2026-08-06-iteration-2/scripts/build_blind_pairs.py
          python benchmarks/design-steward/2026-08-06-iteration-2/scripts/aggregate_grades.py
          python benchmarks/design-steward-specialists/2026-08-06-iteration-2/scripts/build_blind_pairs.py
          python benchmarks/design-steward-specialists/2026-08-06-iteration-2/scripts/aggregate_grades.py
          git diff --exit-code -- \
            benchmarks/design-steward/2026-08-06/blind \
            benchmarks/design-steward/2026-08-06/condition-key.json \
            benchmarks/design-steward/2026-08-06/aggregate.json \
            benchmarks/design-steward/2026-08-06-iteration-2/blind \
            benchmarks/design-steward/2026-08-06-iteration-2/condition-key.json \
            benchmarks/design-steward/2026-08-06-iteration-2/aggregate.json \
            benchmarks/design-steward-specialists/2026-08-06-iteration-2/blind \
            benchmarks/design-steward-specialists/2026-08-06-iteration-2/condition-key.json \
            benchmarks/design-steward-specialists/2026-08-06-iteration-2/aggregate.json
      - name: Verify generated auditor example
        run: |
          mkdir -p build
          python skills/agent-work-auditor/scripts/generate_report.py \
            --input skills/agent-work-auditor/examples/post-hoc-audit.json \
            --output build/post-hoc-audit.html
          cmp skills/agent-work-auditor/examples/post-hoc-audit.html build/post-hoc-audit.html

  install:
    name: skills CLI discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Verify skills CLI discovery
        run: |
          npx --yes skills@1.5.16 add . --list | tee skills-list.txt
          grep -F "agent-work-auditor" skills-list.txt
          grep -F "marktplaats-ad-creator" skills-list.txt
          grep -F "product-design" skills-list.txt
          grep -F "product-design-discovery" skills-list.txt
          grep -F "product-design-direction" skills-list.txt
          grep -F "product-design-contract" skills-list.txt
          grep -F "product-design-prototype" skills-list.txt
          grep -F "product-design-implementation" skills-list.txt
          grep -F "product-design-change" skills-list.txt
          grep -F "product-design-review" skills-list.txt
          ! grep -F "design-steward" skills-list.txt
      - name: Verify clean Codex installation
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          npx --yes skills@1.5.16 add "$GITHUB_WORKSPACE" \
            --skill agent-work-auditor \
            --skill marktplaats-ad-creator \
            --skill product-design \
            --skill product-design-discovery \
            --skill product-design-direction \
            --skill product-design-contract \
            --skill product-design-prototype \
            --skill product-design-implementation \
            --skill product-design-change \
            --skill product-design-review \
            --agent codex \
            --copy \
            --yes
          test -f .agents/skills/agent-work-auditor/SKILL.md
          test -f .agents/skills/marktplaats-ad-creator/SKILL.md
          test -f .agents/skills/product-design/SKILL.md
          test -f .agents/skills/product-design-discovery/SKILL.md
          test -f .agents/skills/product-design-direction/SKILL.md
          test -f .agents/skills/product-design-contract/SKILL.md
          test -f .agents/skills/product-design-prototype/SKILL.md
          test -f .agents/skills/product-design-implementation/SKILL.md
          test -f .agents/skills/product-design-change/SKILL.md
          test -f .agents/skills/product-design-review/SKILL.md
          test ! -e .agents/skills/design-steward

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.26.5
      - name: Scan repository history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact
      - name: Scan working tree for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact
