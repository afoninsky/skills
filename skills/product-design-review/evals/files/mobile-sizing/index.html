<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studio Ember sizing fixture</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <p>Studio Ember · Utrecht</p>
        <h1>Reserve kiln space</h1>
      </header>
      <section class="reservation-layout">
        <figure>
          <div class="kiln" aria-hidden="true">N</div>
          <figcaption aria-hidden="true">N / 80 L</figcaption>
          <p><strong>Kiln Noord</strong><br>Electric · 80 L</p>
        </figure>
        <form>
          <label for="firing-day">Firing day</label>
          <input id="firing-day" type="date" value="2026-09-02">
          <p class="preparation-help">Bring completely dry work labeled with your member number.</p>
          <button type="submit">Confirm reservation</button>
        </form>
      </section>
    </main>
  </body>
</html>
