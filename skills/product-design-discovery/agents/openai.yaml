interface:
  display_name: "Product Design Discovery"
  short_description: "Ground users, flows, and content"
  default_prompt: "Use $product-design-discovery to define the smallest trustworthy users, jobs, journeys, content, states, platform constraints, and product evidence needed for this decision. Inspect existing evidence first, research only unsupported premises that could materially change the design using credible primary and authoritative sources, preserve settled decisions, and pause only for a material unknown."
