<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studio Ember kiln board fixture</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <article class="kiln-card" aria-labelledby="zuid-title">
        <section class="kiln-identity" data-protected="kiln-zuid-identity">
          <div class="kiln-drawing" aria-hidden="true">Z</div>
          <header class="kiln-nameplate">
            <p>02 / SOUTH BAY</p>
            <h1 id="zuid-title" tabindex="-1">Kiln Zuid</h1>
            <p>Gas · 120 L</p>
          </header>
        </section>

        <section class="kiln-detail">
          <div class="status-strip" data-protected="kiln-zuid-status">
            <p>Cooling down</p>
            <strong>284°C</strong>
            <p>Safe to open today · 17:30</p>
          </div>

          <section class="ledger" data-protected="kiln-zuid-ledger">
            <h2>Next on the ledger</h2>
            <ol>
              <li><strong>Thu 3 Sep</strong> · Bisque 1000°C · ½ shelf open</li>
              <li><strong>Sat 5 Sep</strong> · Glaze 1240°C · ¼ shelf open</li>
            </ol>
          </section>
        </section>
      </article>
    </main>
  </body>
</html>
