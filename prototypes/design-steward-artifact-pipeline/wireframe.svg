<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Low-fidelity wireframe for repair-session rescheduling</title>
  <desc id="desc">A desktop wireframe with a heading and progress indicator, current booking ticket, four available session choices, and a confirm action.</desc>
  <rect width="1200" height="760" fill="#e8eff1"/>
  <style>
    .line{fill:none;stroke:#16324f;stroke-width:3}.thin{fill:none;stroke:#68747d;stroke-width:2}.fill{fill:#fff;stroke:#16324f;stroke-width:3}.accent{fill:#e4572e}.head{font:700 26px Rockwell,Georgia,serif;fill:#16324f}.body{font:16px Avenir,Arial,sans-serif;fill:#20252b}.label{font:700 12px Menlo,monospace;letter-spacing:1px;fill:#e4572e}.small{font:13px Menlo,monospace;fill:#505a62}
  </style>
  <text x="52" y="48" class="label">ARTIFACT 03/06 · WIREFRAME</text>
  <rect x="52" y="72" width="1096" height="624" class="fill"/>
  <rect x="52" y="72" width="1096" height="62" fill="#16324f"/>
  <text x="80" y="111" style="font:700 17px Avenir,Arial,sans-serif;fill:#fff">Community repair session</text>
  <text x="80" y="189" class="label">STEP 2 OF 3 · CHOOSE A NEW TIME</text>
  <text x="80" y="236" class="head">Move your lamp to another workbench.</text>
  <path d="M80 260 H675" class="thin"/>
  <text x="80" y="295" class="body">Compare a compatible time, access, repairers and remaining room.</text>
  <g transform="translate(790 172)">
    <rect width="305" height="164" class="fill"/>
    <text x="20" y="31" class="label">CURRENT REPAIR TICKET</text>
    <text x="20" y="68" class="head">CR-0842 · Table lamp</text>
    <path d="M20 86 H285" class="thin"/>
    <text x="20" y="116" class="body">Thu 14 Aug · 19:00</text>
    <text x="20" y="143" class="small">NOTES + PHOTOS CARRY FORWARD</text>
  </g>
  <text x="80" y="372" class="head">Available benches</text>
  <g transform="translate(80 395)">
    <rect width="225" height="180" class="fill"/>
    <rect width="225" height="9" class="accent"/>
    <text x="18" y="42" class="label">BEST MATCH</text>
    <text x="18" y="80" class="head">Tue 12 Aug</text>
    <text x="18" y="110" class="body">18:30 · Workshop hall</text>
    <text x="18" y="138" class="small">STEP-FREE · 2 PLACES</text>
    <rect x="18" y="151" width="18" height="18" class="thin"/>
    <text x="46" y="166" class="body">Choose</text>
  </g>
  <g transform="translate(330 395)">
    <rect width="225" height="180" class="fill"/>
    <text x="18" y="42" class="label">QUIETER</text>
    <text x="18" y="80" class="head">Sat 16 Aug</text>
    <text x="18" y="110" class="body">10:00 · Quiet bench</text>
    <text x="18" y="138" class="small">LOW-SENSORY · 1 PLACE</text>
    <rect x="18" y="151" width="18" height="18" class="thin"/>
    <text x="46" y="166" class="body">Choose</text>
  </g>
  <g transform="translate(580 395)">
    <rect width="225" height="180" class="fill"/>
    <text x="18" y="42" class="label">MORE ROOM</text>
    <text x="18" y="80" class="head">Mon 18 Aug</text>
    <text x="18" y="110" class="body">19:00 · Workshop hall</text>
    <text x="18" y="138" class="small">STEP-FREE · 4 PLACES</text>
    <rect x="18" y="151" width="18" height="18" class="thin"/>
    <text x="46" y="166" class="body">Choose</text>
  </g>
  <g transform="translate(830 395)" opacity="0.45">
    <rect width="225" height="180" class="fill"/>
    <text x="18" y="42" class="label">WAITLIST ONLY</text>
    <text x="18" y="80" class="head">Wed 20 Aug</text>
    <text x="18" y="110" class="body">17:30 · Workshop hall</text>
    <text x="18" y="138" class="small">FULL</text>
  </g>
  <rect x="80" y="615" width="215" height="50" fill="#16324f"/>
  <text x="105" y="647" style="font:700 16px Avenir,Arial,sans-serif;fill:#fff">Confirm new time</text>
  <text x="325" y="647" class="small">NO PAYMENT OR BACKEND CHANGE IN PROTOTYPE</text>
</svg>
